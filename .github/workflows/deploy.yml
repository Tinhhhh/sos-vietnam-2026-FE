name: CI, Build Docker image and Deploy to Render

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Newer run for the same branch/PR cancels the older one (only the latest commit gets deployed)
concurrency:
  group: fe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lint or build failing stops the pipeline: nothing is deployed
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  build-and-deploy:
    needs: ci
    # Only main deploys; "Run workflow" from another branch only runs CI
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sos-vietnam-fe:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/sos-vietnam-fe:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render Deploy Hook
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Render Deploy Hook triggered successfully!"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set, skipping auto-deploy."
          fi
